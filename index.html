<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- connect-src allows any http(s) host because the Ollama server URL is
         user-configured (localhost or LAN). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' http: https:; base-uri 'none'; form-action 'none'"
    />
    <title>AI Voice Chat Hologram</title>
    <link rel="stylesheet" href="/src/index.css" />
  <!-- Removed importmap so Vite resolves local `react` / `react-dom` from node_modules. -->
</head>
  <body class="bg-primary text-gray-200">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
